name: Image processing checks

on:
  pull_request:
    branches: [main]
    paths: ["imageprocess/**", ".github/workflows/imageprocess.yml"]
  push:
    branches: [main]
    paths: ["imageprocess/**", ".github/workflows/imageprocess.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: imageprocess/requirements*.txt
      - run: python -m pip install -r imageprocess/requirements-core.txt
      - name: Import processing module without model SDKs or local HTTP server
        run: python -c "from imageprocess import prepare_item, parse_item_output"
      - run: python -m pip install -r imageprocess/requirements-dev.txt
      - run: python -m pip check
      - name: Offline tests, no model downloads or API calls
        working-directory: imageprocess
        run: python -m pytest -q
