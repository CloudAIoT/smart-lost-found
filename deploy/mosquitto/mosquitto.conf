# 장치 → 백엔드 MQTT 브로커 (docs/mqtt-protocol.md 2절)
#
# 이 파일은 저장소의 사본이다. 운영 중인 값은 EC2의
# /opt/smart-lost-found/mosquitto/mosquitto.conf 이며 ssh로 넣는다.
# 계정 비밀번호가 담긴 passwords 파일은 저장소에 올리지 않는다.
#
# 컨테이너 안에서는 모든 인터페이스를 듣는다. 외부 노출 범위는 Compose가
# Tailscale 주소에만 포트를 공개해서 정한다. 이 파일에 주소를 적지 않는다.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

# 경고는 보존 메시지가 아니다. 백엔드가 꺼져 있는 동안 온 QoS 1 경고는
# 브로커의 세션 큐에 남아야 하고, 그 큐는 브로커를 다시 켜도 살아 있어야 한다.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# 끊긴 구독자(백엔드) 하나가 쌓을 수 있는 상한. 시연 규모에는 충분히 크다.
max_queued_messages 1000
# 키오스크가 보내는 JSON은 작다. 이보다 큰 메시지는 이 규약의 것이 아니다.
# mosquitto 2.0은 message_size_limit 대신 이 설정을 쓴다(페이로드가 아니라 패킷 전체 크기다).
max_packet_size 8192

log_dest stdout
log_type warning
log_type error
connection_messages true
