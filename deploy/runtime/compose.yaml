name: smart-lost-found-prod
services:
  backend:
    image: ${BACKEND_IMAGE:?Image digest required}
    restart: unless-stopped
    env_file:
      - path: ./backend.env
        format: raw
    environment:
      LOCAL_DEVELOPMENT: "false"
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 320m
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mqtt:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    # 호스트에 설정 파일이 있을 때만 켠다. 없는 파일을 bind mount하면 Docker가 빈
    # 디렉터리를 만들어 브로커가 죽고, 그러면 무관한 배포까지 실패한다.
    profiles: ["telemetry"]
    ports:
      # Pi만 닿아야 한다. 기본값 127.0.0.1은 값이 빠졌을 때 1883이 공개되지 않게 막는다.
      # 실제 값은 EC2의 Tailscale 주소이며 SSM 설정에서 온다(deploy.sh가 넣는다).
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
    volumes:
      - /opt/smart-lost-found/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /opt/smart-lost-found/mosquitto/passwords:/mosquitto/config/passwords:ro
      - /opt/smart-lost-found/mosquitto/acl:/mosquitto/config/acl:ro
      # 끊긴 백엔드 세션에 쌓인 QoS 1 경고가 브로커 재시작에도 남아야 한다.
      - mosquitto_data:/mosquitto/data
    mem_limit: 48m
    security_opt:
      - no-new-privileges:true
    logging: *logging
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - path: ./db.env
        format: raw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 300m
    shm_size: 64m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/smart-lost-found/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/smart-lost-found/letsencrypt:/etc/letsencrypt:ro
      - /opt/smart-lost-found/acme:/var/www/acme:ro
      # 릴리스 디렉터리(이 파일 위치) 기준 경로. 이미지에서 복사된 프론트 빌드 결과물.
      - ./frontend:/usr/share/nginx/html:ro
    mem_limit: 48m
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
volumes:
  postgres_data:
    name: smart-lost-found-postgres-production
  mosquitto_data:
    name: smart-lost-found-mosquitto-production
