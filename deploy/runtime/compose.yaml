name: smart-lost-found-prod
services:
  backend:
    image: ${BACKEND_IMAGE:?Image digest required}
    restart: unless-stopped
    env_file:
      - path: ./backend.env
        format: raw
    environment:
      LOCAL_DEVELOPMENT: "false"
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 320m
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - path: ./db.env
        format: raw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 300m
    shm_size: 64m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/smart-lost-found/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/smart-lost-found/letsencrypt:/etc/letsencrypt:ro
      - /opt/smart-lost-found/acme:/var/www/acme:ro
    mem_limit: 48m
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
volumes:
  postgres_data:
    name: smart-lost-found-postgres-production
