server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /health { proxy_pass http://backend:8000; }
    location = /ready { proxy_pass http://backend:8000; }
    location = /docs { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }
    location /api/ { proxy_pass http://backend:8000; }
    root /usr/share/nginx/html;
    # Vite 빌드 산출물은 파일명에 해시가 붙으므로 오래 캐시한다.
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    # 그 외 경로는 SPA 진입점(index.html)으로 보낸다. index.html은 배포마다 바뀌므로 캐시하지 않는다.
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
